<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline' https://open.spotify.com https://open.spotifycdn.com; style-src 'unsafe-inline'; img-src https: http: data:; media-src https: http:; frame-src 'self' https://open.spotify.com https://embed.music.apple.com https://www.kika.de">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#fff4d6">
<!-- Als App auf den Home-Bildschirm (iPad/iPhone): Vollbild ohne Safari-Leisten -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SpotiMy">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>SpotiMy</title>
<style>
  :root {
    color-scheme: light;
    --bg: #fff4d6;
    --ink: #2b2147;
    --purple: #6a4cff;
    --purple-dark: #4b32c9;
    --yellow: #ffcf33;
    --white: #ffffff;
    --c1: #ff7a3d;
    --c2: #20b8a6;
    --c3: #ff4f8b;
    --c4: #6a4cff;
    --c5: #3fae49;
    --c6: #2f8cff;
    --radius: 24px;
    --shadow: 0 6px 0 rgba(43, 33, 71, .18);
    --player-h: 0px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Nunito", system-ui, sans-serif;
    background:
      radial-gradient(circle at 10% 0%, #ffe59a 0 120px, transparent 121px),
      radial-gradient(circle at 95% 8%, #ffd9e6 0 90px, transparent 91px),
      var(--bg);
    background-attachment: fixed;
    color: var(--ink);
    line-height: 1.3;
    padding-bottom: calc(var(--player-h) + 24px);
  }
  header, main {
    max-width: 1100px; margin: 0 auto;
    padding: 0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
  }
  header { padding-top: max(20px, env(safe-area-inset-top)); }
  h1 { margin: 0; font-size: 2rem; letter-spacing: .5px; color: var(--purple); }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; }
  /* Touch: kein Doppeltipp-Zoom, kein grauer Tipp-Blitz, kein Markieren bei langem Druck */
  button, a, .seek { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  .tile, .episode, .round, .back, .player { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  img { -webkit-user-drag: none; }

  /* Cover und Platzhalter */
  .cover {
    display: block;
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border-radius: calc(var(--radius) - 8px);
    background: #ffe7a8;
  }
  .placeholder {
    background:
      radial-gradient(circle at 50% 45%, #fff 0 14%, transparent 15%),
      radial-gradient(circle at 50% 45%, var(--yellow) 0 30%, transparent 31%),
      linear-gradient(135deg, #ffe7a8, #ffc0d6);
  }

  /* Startseite: Kacheln */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
    padding: 20px 0 32px;
  }
  .tile {
    border: 0;
    border-radius: var(--radius);
    padding: 12px 12px 16px;
    background: var(--tile, var(--c1));
    color: var(--white);
    box-shadow: var(--shadow);
    cursor: pointer;
    text-align: center;
    transition: transform .12s, box-shadow .12s;
  }
  @media (hover: hover) {
    .tile:hover { transform: translateY(-3px) rotate(-.5deg); }
  }
  .tile:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(43, 33, 71, .18); }
  .tile:focus-visible, .episode:focus-visible, .round:focus-visible, .back:focus-visible {
    outline: 4px solid var(--purple-dark);
    outline-offset: 3px;
  }
  .tile h2 {
    margin: 12px 4px 0;
    font-size: 1.25rem;
    line-height: 1.2;
    overflow-wrap: break-word;
  }

  /* Detailansicht */
  .detail-head { display: flex; align-items: center; gap: 14px; margin: 16px 0 8px; }
  .back {
    flex: none;
    width: 56px; height: 56px;
    border: 0; border-radius: 50%;
    background: var(--white);
    color: var(--purple);
    font-size: 1.8rem; font-weight: 700;
    box-shadow: var(--shadow);
    cursor: pointer;
  }
  .back:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(43, 33, 71, .18); }
  .detail-head .cover { width: 64px; flex: none; border-radius: 16px; }
  .detail-head h2 { margin: 0; font-size: 1.5rem; line-height: 1.2; }

  .episodes {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 16px;
    list-style: none;
    margin: 12px 0 0; padding: 0;
  }
  .episode {
    position: relative;
    width: 100%;
    min-width: 0;
    border: 0;
    border-radius: var(--radius);
    padding: 8px 8px 12px;
    background: var(--white);
    box-shadow: var(--shadow);
    cursor: pointer;
    text-align: center;
    transition: transform .12s;
  }
  .episode:active { transform: translateY(3px); }
  .episode .thumb { position: relative; }
  .episode .badge {
    position: absolute; right: 8px; bottom: 8px;
    width: 52px; height: 52px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--yellow); color: var(--ink);
    border: 3px solid var(--white);
    box-shadow: 0 3px 0 rgba(43, 33, 71, .25);
  }
  .episode .badge svg { width: 26px; height: 26px; }
  .episode h3 {
    margin: 10px 4px 0;
    font-size: 1.05rem;
    line-height: 1.25;
    overflow-wrap: break-word;
  }
  .episode.active { background: var(--yellow); box-shadow: 0 0 0 4px var(--purple), var(--shadow); }
  .episode.active .badge { background: var(--purple); color: var(--white); }

  /* Großer Player, unten fixiert */
  .player {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 10;
    padding: 12px 16px calc(14px + env(safe-area-inset-bottom));
    background: var(--purple);
    color: var(--white);
    border-radius: 28px 28px 0 0;
    box-shadow: 0 -6px 24px rgba(43, 33, 71, .25);
  }
  .player-inner { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 16px; }
  .player .cover { width: 96px; flex: none; border-radius: 18px; }
  .player-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
  .player-title {
    margin: 0; font-size: 1.15rem; font-weight: 700; line-height: 1.25;
    overflow-wrap: break-word;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .controls { display: flex; align-items: center; justify-content: center; gap: 18px; }
  .round {
    border: 0; border-radius: 50%;
    display: grid; place-items: center;
    cursor: pointer;
    background: rgba(255, 255, 255, .18);
    color: var(--white);
    width: 60px; height: 60px;
  }
  .round svg { width: 30px; height: 30px; }
  .round:active { transform: scale(.94); }
  .round.play {
    width: 84px; height: 84px;
    background: var(--yellow); color: var(--ink);
    box-shadow: 0 5px 0 rgba(0, 0, 0, .25);
  }
  .round.play svg { width: 42px; height: 42px; }
  .round.play:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0, 0, 0, .25); }

  .seek {
    --p: 0%;
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 14px; margin: 0;
    border-radius: 7px;
    background: linear-gradient(to right, var(--yellow) var(--p), rgba(255, 255, 255, .3) var(--p));
    cursor: pointer;
  }
  .seek::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--white); border: 4px solid var(--yellow);
  }
  .seek::-moz-range-thumb {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--white); border: 4px solid var(--yellow);
  }
  .times {
    display: flex; justify-content: space-between;
    margin-top: -2px;
    font-size: 1rem; font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .player-error { margin: 0; font-weight: 700; color: var(--yellow); }

  /* Suche */
  .search {
    position: relative;
    margin: 18px 0 0;
  }
  .search input {
    width: 100%;
    font: inherit;
    font-size: 1.2rem;
    color: var(--ink);
    padding: 16px 60px 16px 56px;
    border: 4px solid var(--white);
    border-radius: 999px;
    background: var(--white);
    box-shadow: var(--shadow);
    outline: none;
    -webkit-appearance: none; appearance: none;
  }
  .search input:focus { border-color: var(--purple); }
  .search input::placeholder { color: #8a83a3; }
  .search input::-webkit-search-cancel-button { display: none; }
  .search .icon {
    position: absolute; left: 20px; top: 50%; transform: translateY(-50%);
    width: 26px; height: 26px; color: var(--purple); pointer-events: none;
  }
  .search .clear {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    width: 44px; height: 44px; border: 0; border-radius: 50%;
    background: var(--bg); color: var(--ink);
    font-size: 1.4rem; font-weight: 700; cursor: pointer;
  }
  .results-info { margin: 18px 4px 0; font-size: 1.1rem; font-weight: 700; color: var(--purple); }
  .episode .from {
    display: block; margin: 4px 4px 0;
    font-size: .8rem; font-weight: 700; color: var(--from, var(--purple));
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .episode.active .from { color: var(--ink); }

  /* Eingebetteter Spotify-Player; dort den eigenen Player ausblenden */
  body.spotify-mode .player { display: none; }
  .spotify-frame {
    display: block;
    width: 100%;
    height: 560px;
    max-height: calc(100vh - 160px);
    min-height: 352px;
    margin-top: 12px;
    border: 0;
    border-radius: var(--radius);
    background: var(--white);
    box-shadow: var(--shadow);
  }
  /* Spotify-Folge: kompakter Spotify-Player unten fest, wie der eigene Player */
  .spotify-frame.album iframe { display: block; width: 100%; height: 100%; border: 0; }
  .spotify-frame.album .embed { flex: 1; min-height: 0; }
  /* Apple-Music-Player braucht etwas mehr Höhe (175 px) */
  .spotify-frame.album.apple { height: calc(229px + env(safe-area-inset-bottom)); }
  .spotify-open {
    flex: none;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    height: 54px;
    background: var(--purple);
    color: var(--white);
    font-size: 1.05rem; font-weight: 700;
    text-decoration: none;
  }
  .spotify-open:active { background: var(--purple-dark); }
  .spotify-open:focus-visible { outline: 4px solid var(--yellow); outline-offset: -4px; }
  .spotify-frame.album {
    display: flex; flex-direction: column;
    background: var(--purple);
    overflow: hidden;
    position: fixed;
    left: 50%; bottom: 0; z-index: 10;
    transform: translateX(-50%);
    width: min(100%, 1100px);
    height: calc(206px + env(safe-area-inset-bottom)); min-height: 0; max-height: none;
    padding-bottom: env(safe-area-inset-bottom);
    margin: 0;
    border-radius: 20px 20px 0 0;
    box-shadow: 0 -6px 24px rgba(43, 33, 71, .25);
  }
  .tile .tag {
    display: inline-block;
    margin-top: 6px;
    padding: 2px 10px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .25);
    font-size: .85rem; font-weight: 700;
  }

  /* Hauptmenü: Podcasts, Videos, Spiele */
  .menu {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 22px;
    padding: 24px 0 32px;
  }
  .menu-tile {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    min-height: 230px;
    border: 0; border-radius: 32px;
    background: var(--tile); color: var(--white);
    font-size: 1.9rem; font-weight: 800; letter-spacing: .5px;
    box-shadow: var(--shadow);
    cursor: pointer;
  }
  .menu-tile .icon { font-size: 4.6rem; line-height: 1; }
  .menu-tile:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(43, 33, 71, .18); }
  .menu-tile:focus-visible { outline: 4px solid var(--purple-dark); outline-offset: 3px; }
  @media (hover: hover) {
    .menu-tile:hover { transform: translateY(-3px) rotate(-.5deg); }
  }
  .section-head { margin-top: 18px; }
  @media (min-width: 601px) {
    .menu-tile { min-height: min(46vh, 380px); font-size: 2.2rem; }
    .menu-tile .icon { font-size: 6rem; }
  }

  /* Großes Fenster für Videos und Spiele */
  .layer {
    position: fixed; inset: 0; z-index: 100;
    display: flex; flex-direction: column;
    padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    background: rgba(25, 16, 50, .95);
    color: var(--white);
  }
  .layer-bar { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
  .layer-bar h2 {
    flex: 1; margin: 0; font-size: 1.3rem; line-height: 1.25;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .layer-close {
    flex: none; width: 60px; height: 60px; border: 0; border-radius: 50%;
    background: var(--yellow); color: var(--ink);
    font-size: 2rem; font-weight: 800; line-height: 1; cursor: pointer;
    box-shadow: 0 4px 0 rgba(0, 0, 0, .3);
  }
  .layer-body { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  .layer-media.fill { width: 100%; height: 100%; aspect-ratio: auto; background: #120c2b; }
  .layer-media {
    display: block;
    width: min(100%, calc((100vh - 120px) * var(--ratio, 1.7778)));
    aspect-ratio: var(--ratio, 1.7778);
    max-height: 100%;
    border: 0; border-radius: 18px;
    background: #000;
  }

  .notice {
    background: var(--white);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px;
    margin: 20px 0;
    font-size: 1.1rem;
  }
  .notice p { margin: 8px 0 0; font-size: 1rem; }

  /* Tablet quer (z. B. iPad mini 1133×744): Player als große Seitenleiste rechts,
     damit die Kacheln die ganze Höhe bekommen */
  @media (min-width: 900px) and (orientation: landscape) {
    body.has-player { padding-right: var(--sidebar-w); padding-bottom: 24px; }
    :root { --sidebar-w: 340px; }
    .player {
      left: auto; top: 0; right: 0; bottom: 0;
      width: var(--sidebar-w);
      padding: max(28px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
               max(24px, env(safe-area-inset-bottom)) 24px;
      border-radius: 32px 0 0 32px;
      box-shadow: -6px 0 24px rgba(43, 33, 71, .25);
      display: flex; flex-direction: column; justify-content: center;
    }
    .player-inner { flex-direction: column; align-items: stretch; gap: 22px; width: 100%; }
    .player .cover { width: min(100%, 260px); align-self: center; border-radius: 24px; }
    .player-title {
      text-align: center; font-size: 1.3rem; line-height: 1.25;
      -webkit-line-clamp: 5;
    }
    .player-main { gap: 16px; }
    .controls { gap: 22px; }
    .round { width: 68px; height: 68px; }
    .round.play { width: 100px; height: 100px; }
    .round.play svg { width: 50px; height: 50px; }
  }

  /* Tablet hoch (z. B. iPad mini 744×1133): etwas größere Tasten und Cover */
  @media (min-width: 601px) and (orientation: portrait) {
    .player .cover { width: 120px; }
    .round { width: 68px; height: 68px; }
    .round.play { width: 96px; height: 96px; }
    .round.play svg { width: 48px; height: 48px; }
    .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; }
    .episodes { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
  }

  @media (max-width: 600px) {
    h1 { font-size: 1.7rem; }
    .menu { grid-template-columns: 1fr; gap: 16px; }
    .menu-tile { flex-direction: row; min-height: 120px; font-size: 1.7rem; gap: 18px; }
    .menu-tile .icon { font-size: 3.4rem; }
    .layer-bar h2 { font-size: 1.1rem; }
    .grid { grid-template-columns: 1fr; gap: 16px; }
    .tile { display: flex; align-items: center; gap: 14px; text-align: left; padding: 10px; }
    .tile .cover { width: 96px; flex: none; }
    .tile h2 { margin: 0; font-size: 1.3rem; }
    /* Handy: Folgen als Liste – Bild links, ganzer Titel rechts */
    .episodes { grid-template-columns: 1fr; gap: 12px; }
    .episode { display: flex; align-items: center; gap: 14px; padding: 8px 12px 8px 8px; text-align: left; }
    .episode .thumb { width: 104px; flex: none; }
    .episode .text { flex: 1; min-width: 0; }
    .episode h3 { margin: 0; font-size: 1.1rem; }
    .episode .from { margin: 4px 0 0; }
    .episode .badge { width: 40px; height: 40px; right: 6px; bottom: 6px; }
    .episode .badge svg { width: 20px; height: 20px; }
    .player-title { font-size: 1.05rem; }
    .player-inner { flex-direction: column; gap: 10px; }
    .player .cover { display: none; }
    .player-main { width: 100%; }
    .player-title { text-align: center; }
  }
</style>
</head>
<body>
<header>
  <h1>🎧 SpotiMy</h1>
</header>

<main>
  <section id="overview" aria-label="Übersicht">
    <div class="detail-head section-head" id="section-head" hidden>
      <button type="button" class="back" id="section-back" aria-label="Zurück zum Hauptmenü">←</button>
      <h2 id="section-title"></h2>
    </div>
    <form class="search" id="search-form" role="search" hidden>
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.5-4.5"/></svg>
      <input type="search" id="search" placeholder="Suchen …" aria-label="Folgen und Videos suchen" autocomplete="off" enterkeyhint="search">
      <button type="button" class="clear" id="search-clear" aria-label="Suche löschen" hidden>×</button>
    </form>
    <div class="menu" id="menu" hidden></div>
    <div class="grid" id="grid"></div>
    <div id="results" hidden>
      <p class="results-info" id="results-info" aria-live="polite"></p>
      <ul class="episodes" id="results-list"></ul>
    </div>
  </section>

  <section id="detail" hidden>
    <div class="detail-head">
      <button type="button" class="back" id="back" aria-label="Zurück zur Übersicht">←</button>
      <div id="detail-cover"></div>
      <h2 id="detail-title"></h2>
    </div>
    <ul class="episodes" id="episodes"></ul>
  </section>
</main>

<div class="layer" id="layer" hidden role="dialog" aria-modal="true" aria-labelledby="layer-title">
  <div class="layer-bar">
    <h2 id="layer-title"></h2>
    <button type="button" class="layer-close" id="layer-close" aria-label="Schließen">×</button>
  </div>
  <div class="layer-body" id="layer-body"></div>
</div>

<div class="player" id="player" hidden aria-label="Player">
  <div class="player-inner">
    <div id="player-cover"></div>
    <div class="player-main">
      <p class="player-title" id="player-title"></p>
      <p class="player-error" id="player-error" hidden>Diese Folge kann gerade nicht abgespielt werden.</p>
      <div class="controls">
        <button type="button" class="round" id="rewind" aria-label="15 Sekunden zurück">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        </button>
        <button type="button" class="round play" id="toggle" aria-label="Abspielen">
          <svg viewBox="0 0 24 24" fill="currentColor" id="icon-play"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l11-6.5a1 1 0 0 0 0-1.72l-11-6.5A1 1 0 0 0 8 5.5z"/></svg>
          <svg viewBox="0 0 24 24" fill="currentColor" id="icon-pause" hidden><rect x="6" y="4.5" width="4.5" height="15" rx="1.5"/><rect x="13.5" y="4.5" width="4.5" height="15" rx="1.5"/></svg>
        </button>
        <button type="button" class="round" id="forward" aria-label="15 Sekunden vor">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
        </button>
      </div>
      <input type="range" class="seek" id="seek" min="0" max="1000" value="0" aria-label="Position in der Folge">
      <div class="times">
        <span id="time-elapsed" aria-label="Vergangene Zeit">0:00</span>
        <span id="time-remaining" aria-label="Restzeit">–:––</span>
      </div>
    </div>
  </div>
  <audio id="audio" preload="none"></audio>
</div>

<script>
(function () {
  "use strict";

  const TILE_COLORS = ["--c1", "--c2", "--c3", "--c4", "--c5", "--c6"];
  const PLAY_SVG = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l11-6.5a1 1 0 0 0 0-1.72l-11-6.5A1 1 0 0 0 8 5.5z"/></svg>';
  const PAUSE_SVG = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="4.5" width="4.5" height="15" rx="1.5"/><rect x="13.5" y="4.5" width="4.5" height="15" rx="1.5"/></svg>';

  const $ = function (id) { return document.getElementById(id); };
  const gridEl = $("grid");
  const overviewEl = $("overview");
  const detailEl = $("detail");
  const episodesEl = $("episodes");
  const playerEl = $("player");
  const audio = $("audio");
  const toggleBtn = $("toggle");
  const seekEl = $("seek");

  let podcasts = [];
  let lastTile = null;
  let current = null; // { podcastIndex, episodeIndex }
  let spotifyCurrent = null; // im Spotify-Player geöffnete Folge { pi, ei }
  let pendingSpotify = null; // aus der Suche gewählte Spotify-Folge
  let spotifyUsed = false; // in dieser Detailansicht wurde ein Spotify-Player geladen
  let view = "menu"; // menu | podcasts | videos | spiele | detail
  const navStack = []; // per Antippen geöffnete Ansichten, für den Zurück-Knopf
  let seeking = false;

  // Element mit reinem Text erzeugen (Feed-Inhalte nie als HTML einfügen)
  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }

  // Nur http(s)-Adressen zulassen
  function safeUrl(value) {
    if (typeof value !== "string" || !value) return null;
    try {
      const url = new URL(value, location.href);
      return url.protocol === "https:" || url.protocol === "http:" ? url.href : null;
    } catch (e) {
      return null;
    }
  }

  function cover(src) {
    const url = safeUrl(src);
    if (!url) {
      const ph = el("div", "cover placeholder");
      ph.setAttribute("aria-hidden", "true");
      return ph;
    }
    const img = el("img", "cover");
    img.src = url;
    img.alt = "";
    img.loading = "lazy";
    img.decoding = "async";
    img.referrerPolicy = "no-referrer";
    img.addEventListener("error", function () { img.replaceWith(cover(null)); }, { once: true });
    return img;
  }

  // Kurzer Name ohne Untertitel: "Lachlabor - Lustiges Wissen …" -> "Lachlabor"
  function showName(p) {
    const full = (p && p.title) || "Podcast";
    const short = full.split(/\s+[-–—|:]\s+/)[0].trim();
    return short.length >= 3 ? short : full;
  }

  // Folgentitel ohne den Sendungsnamen davor: "CheckPod Milchstraße | Galaxie" -> "Milchstraße – Galaxie"
  function episodeName(p, ep) {
    let title = (ep && ep.title) || "Folge";
    const name = showName(p);
    // nur wenn danach etwas Neues beginnt ("CheckPod Milchstraße"), nicht "Mikado am Morgen"
    const rest = title.slice(name.length);
    if (title.toLowerCase().indexOf(name.toLowerCase()) === 0 && rest.length > 3 &&
        /^(\s*[:|–-]\s*|\s+(?=[A-ZÄÖÜ0-9]))/.test(rest)) {
      title = rest.replace(/^[\s:|–-]+/, "");
    }
    return title.replace(/\s+\|\s+/g, " – ");
  }

  // Bild der Folge, sonst das Cover des Podcasts
  function episodeImage(p, ep) {
    return safeUrl(ep.image) || safeUrl(p.image);
  }

  /* ---------- Hauptmenü und Bereiche ---------- */

  const SECTIONS = {
    podcasts: { title: "Podcasts", icon: "🎧", color: "--c4" },
    videos: { title: "Videos", icon: "📺", color: "--c1" },
    spiele: { title: "Spiele", icon: "🎮", color: "--c2" }
  };

  function sectionOf(p) {
    return p.type === "video" ? "videos" : p.type === "games" ? "spiele" : "podcasts";
  }

  function sectionHas(key) {
    return podcasts.some(function (p) { return sectionOf(p) === key && (p.episodes || []).length; });
  }

  function navigate(hash) {
    navStack.push({ from: location.hash, to: hash });
    location.hash = hash;
  }

  function renderMenu() {
    const menu = $("menu");
    menu.replaceChildren();
    Object.keys(SECTIONS).forEach(function (key) {
      if (!sectionHas(key)) return;
      const s = SECTIONS[key];
      const tile = el("button", "menu-tile");
      tile.type = "button";
      tile.style.setProperty("--tile", "var(" + s.color + ")");
      const icon = el("span", "icon", s.icon);
      icon.setAttribute("aria-hidden", "true");
      tile.append(icon, el("span", null, s.title));
      tile.addEventListener("click", function () { navigate("#" + key); });
      menu.append(tile);
    });
  }

  // Erscheinungsdatum als Zahl (ohne Datum: ganz nach hinten)
  function episodeTime(ep) {
    const t = Date.parse((ep && ep.published) || "");
    return isNaN(t) ? 0 : t;
  }

  function showTime(p) {
    return (p.episodes || []).reduce(function (max, ep) { return Math.max(max, episodeTime(ep)); }, 0);
  }

  // Indizes der Folgen, neueste zuerst (Indizes bleiben die aus den Daten)
  function episodeOrder(p) {
    return (p.episodes || []).map(function (ep, i) { return i; })
      .sort(function (a, b) { return episodeTime(p.episodes[b]) - episodeTime(p.episodes[a]) || a - b; });
  }

  function renderOverview(section) {
    gridEl.replaceChildren();
    if (section === "spiele") { renderGames(); return; }
    // Sendungen mit der neuesten Folge zuerst
    podcasts.map(function (p, index) { return index; })
      .filter(function (index) { return sectionOf(podcasts[index]) === section; })
      .sort(function (a, b) { return showTime(podcasts[b]) - showTime(podcasts[a]) || a - b; })
      .forEach(function (index) {
      const p = podcasts[index];
      const tile = el("button", "tile");
      tile.type = "button";
      tile.style.setProperty("--tile", "var(" + TILE_COLORS[index % TILE_COLORS.length] + ")");
      const name = el("div");
      name.append(el("h2", null, showName(p)));
      if (p.type === "spotify") name.append(el("span", "tag", "Spotify"));
      if (p.type === "apple") name.append(el("span", "tag", "Apple Music"));
      tile.append(cover(p.image), name);
      tile.addEventListener("click", function () {
        lastTile = tile;
        navigate("#podcast-" + index);
      });
      gridEl.append(tile);
    });
  }

  // Alle Spiele aus allen "spiele:"-Zeilen als Kacheln
  function renderGames() {
    podcasts.forEach(function (p, pi) {
      if (sectionOf(p) !== "spiele") return;
      (p.episodes || []).forEach(function (game, gi) {
        if (!safeUrl(game.game_url)) return;
        const tile = el("button", "tile");
        tile.type = "button";
        tile.style.setProperty("--tile", "var(" + TILE_COLORS[(pi + gi) % TILE_COLORS.length] + ")");
        const name = el("div");
        name.append(el("h2", null, game.title || "Spiel"));
        tile.append(cover(game.image), name);
        tile.addEventListener("click", function () { lastTile = tile; openGame(pi, gi); });
        gridEl.append(tile);
      });
    });
  }

  /* ---------- Großes Fenster: Videos und Spiele ---------- */

  const layerEl = $("layer");
  const layerBody = $("layer-body");

  function openLayer(title) {
    audio.pause(); // nicht gleichzeitig Podcast und Video
    $("layer-title").textContent = title || "";
    layerBody.replaceChildren();
    layerEl.hidden = false;
    document.body.style.overflow = "hidden";
    $("layer-close").focus({ preventScroll: true });
  }

  function closeLayer() {
    if (layerEl.hidden) return;
    layerBody.querySelectorAll("video").forEach(function (v) { v.pause(); v.removeAttribute("src"); v.load(); });
    layerBody.replaceChildren();
    layerEl.hidden = true;
    document.body.style.overflow = "";
    if (lastTile) lastTile.focus({ preventScroll: true });
  }

  function openVideo(pi, ei) {
    const ep = podcasts[pi].episodes[ei];
    const src = safeUrl(ep.video_url);
    if (!src) return;
    openLayer(episodeName(podcasts[pi], ep));
    const video = el("video", "layer-media");
    video.controls = true;
    video.playsInline = true;
    video.setAttribute("playsinline", "");
    video.preload = "metadata";
    const poster = episodeImage(podcasts[pi], ep);
    if (poster) video.poster = poster;
    video.src = src;
    video.addEventListener("error", function () {
      layerBody.replaceChildren(el("p", "notice", "Dieses Video ist gerade nicht verfügbar."));
    });
    layerBody.append(video);
    video.play().catch(function () { /* dann auf Play tippen */ });
  }

  function openGame(pi, gi) {
    const game = podcasts[pi].episodes[gi];
    const src = safeUrl(game.game_url);
    if (!src) return;
    if (!game.embeddable) {
      // KiKA erlaubt das Einbetten nicht – dann direkt bei KiKA öffnen
      window.open(safeUrl(game.link) || src, "_blank", "noopener");
      return;
    }
    openLayer(game.fill ? "" : game.title); // eigene Spiele zeigen ihren Namen selbst
    // Eigene Spiele bekommen die ganze Fläche und richten sich selbst ein
    const frame = el("iframe", "layer-media" + (game.fill ? " fill" : ""));
    frame.src = src;
    frame.title = game.title || "Spiel";
    frame.allow = "autoplay; fullscreen";
    if (game.width > 0 && game.height > 0) frame.style.setProperty("--ratio", game.width / game.height);
    layerBody.append(frame);
  }

  $("layer-close").addEventListener("click", closeLayer);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeLayer(); });

  /* ---------- Folgen-Kachel (Detailansicht und Suche) ---------- */

  function episodeCard(pi, ei, showPodcast) {
    const p = podcasts[pi];
    const ep = p.episodes[ei];
    const li = el("li");
    const card = el("button", "episode");
    card.type = "button";
    card.dataset.podcast = pi;
    card.dataset.episode = ei;

    const thumb = el("div", "thumb");
    thumb.append(cover(episodeImage(p, ep)));
    const badge = el("span", "badge");
    badge.setAttribute("aria-hidden", "true");
    thumb.append(badge);

    const text = el("div", "text");
    text.append(el("h3", null, episodeName(p, ep)));
    if (showPodcast) {
      const from = el("span", "from", showName(p));
      from.style.setProperty("--from", "var(" + TILE_COLORS[pi % TILE_COLORS.length] + ")");
      text.append(from);
    }
    card.append(thumb, text);
    card.addEventListener("click", function () {
      lastTile = card;
      if (safeUrl(ep.audio_url)) playEpisode(pi, ei);
      else if (safeUrl(ep.video_url)) openVideo(pi, ei);
      else openSpotifyEpisode(pi, ei);
    });
    li.append(card);
    return li;
  }

  /* ---------- Suche über alle Podcasts ---------- */

  const searchInput = $("search");
  const resultsEl = $("results");
  const resultsList = $("results-list");
  let searchIndex = [];

  // Kleinschreibung, Umlaute/Akzente vereinheitlichen: "Mäuse" findet auch "mause"
  function normalize(text) {
    return String(text || "").toLowerCase()
      .replace(/ß/g, "ss")
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  }

  function buildSearchIndex() {
    searchIndex = [];
    podcasts.forEach(function (p, pi) {
      if (sectionOf(p) === "spiele") return;
      (p.episodes || []).forEach(function (ep, ei) {
        if (!isPlayable(ep)) return;
        searchIndex.push({
          pi: pi, ei: ei,
          title: normalize(ep.title),
          text: normalize([ep.title, ep.summary, p.title].join(" "))
        });
      });
    });
  }

  function runSearch() {
    const query = normalize(searchInput.value).trim();
    $("search-clear").hidden = !query;
    if (!query) {
      resultsEl.hidden = true;
      gridEl.hidden = view === "menu";
      $("menu").hidden = view !== "menu";
      resultsList.replaceChildren();
      return;
    }
    const words = query.split(/\s+/);
    const hits = searchIndex
      .filter(function (e) { return words.every(function (w) { return e.text.includes(w); }); })
      // Neueste zuerst
      .sort(function (a, b) {
        return episodeTime(podcasts[b.pi].episodes[b.ei]) - episodeTime(podcasts[a.pi].episodes[a.ei]) ||
          a.pi - b.pi || a.ei - b.ei;
      });

    gridEl.hidden = true;
    $("menu").hidden = true;
    resultsEl.hidden = false;
    resultsList.replaceChildren();
    $("results-info").textContent = hits.length
      ? (hits.length === 1 ? "1 Folge gefunden" : hits.length + " Folgen gefunden")
      : "Nichts gefunden 🙈";
    hits.forEach(function (h) { resultsList.append(episodeCard(h.pi, h.ei, true)); });
    updateCards();
  }

  searchInput.addEventListener("input", runSearch);
  $("search-form").addEventListener("submit", function (e) {
    e.preventDefault();
    searchInput.blur(); // Tastatur auf dem Handy schließen
  });
  $("search-clear").addEventListener("click", function () {
    searchInput.value = "";
    runSearch();
    searchInput.focus();
  });

  /* ---------- Detailansicht ---------- */

  function renderDetail(index) {
    const p = podcasts[index];
    $("detail-cover").replaceChildren(cover(p.image));
    $("detail-title").textContent = showName(p);

    episodesEl.replaceChildren();
    removeSpotify();

    episodeOrder(p).forEach(function (i) {
      if (isPlayable(p.episodes[i])) episodesEl.append(episodeCard(index, i, false));
    });

    // Spotify ohne einzelne Folgen: Spotify-Player des Künstlers zeigen.
    // Er wird erst jetzt geladen – keine Spotify-Inhalte auf der Startseite.
    if (p.type === "spotify" && !episodesEl.children.length) {
      const embed = embedUrl(p.embed_url);
      if (embed) showSpotify(embed, p.title, false);
      return;
    }

    if (!episodesEl.children.length) {
      episodesEl.append(el("li", "notice", "Hier gibt es noch keine Folgen."));
    }

    // Apple Music: aus der Suche heraus gewählte Folge gleich öffnen
    if (p.type === "apple" && pendingSpotify && pendingSpotify.pi === index) {
      const pending = pendingSpotify;
      pendingSpotify = null;
      openSpotifyEpisode(pending.pi, pending.ei);
    }

    // Spotify-Steuerung schon vorladen, damit die Folge beim Antippen sofort startet
    if (p.type === "spotify") {
      const pending = pendingSpotify && pendingSpotify.pi === index ? pendingSpotify : null;
      pendingSpotify = null;
      loadSpotifyApi()
        .catch(function () { /* dann normaler eingebetteter Player */ })
        .then(function () {
          // Aus der Suche heraus gewählte Folge öffnen (falls noch in dieser Ansicht)
          if (pending && location.hash === "#podcast-" + index) openSpotifyEpisode(pending.pi, pending.ei);
        });
    }
    updateCards();
  }

  function isPlayable(ep) {
    return Boolean(safeUrl(ep.audio_url) || safeUrl(ep.video_url) || embedUrl(ep.embed_url));
  }

  // Link zum Öffnen in der Spotify- bzw. Apple-Music-App (dort laufen ganze Folgen)
  function spotifyOpenUrl(embed) {
    return isApple(embed)
      ? embed.replace("https://embed.music.apple.com/", "https://music.apple.com/")
      : embed.replace("/embed/", "/");
  }

  // Unten fester Kasten: Knopf "In Spotify öffnen" + Platz für den Spotify-Player
  function spotifyAlbumBox(embed, title) {
    const apple = isApple(embed);
    const box = el("div", "spotify-frame album" + (apple ? " apple" : ""));
    box.id = "spotify-frame";
    box.title = (apple ? "Apple-Music-Player: " : "Spotify-Player: ") + (title || "");
    const open = el("a", "spotify-open", apple ? "▶ In Apple Music öffnen" : "▶ Ganze Folge in Spotify öffnen");
    open.id = "spotify-open";
    open.href = spotifyOpenUrl(embed);
    open.target = "_blank";
    open.rel = "noopener noreferrer";
    const holder = el("div", "embed");
    box.append(open, holder);
    return { box: box, holder: holder };
  }

  function placeSpotifyBox(box) {
    const old = $("spotify-frame");
    if (old) old.replaceWith(box);
    else detailEl.insertBefore(box, episodesEl);
  }

  // Spotify-Player über der Folgenliste anzeigen (bzw. die Folge darin wechseln)
  function showSpotify(embed, title, album) {
    audio.pause(); // nicht zwei Player gleichzeitig
    // Immer ein neues iframe statt src zu ändern – das hält den Browserverlauf sauber
    const frame = el("iframe", album ? null : "spotify-frame");
    frame.allow = "autoplay *; clipboard-write; encrypted-media *; fullscreen *; picture-in-picture";
    frame.title = (isApple(embed) ? "Apple-Music-Player: " : "Spotify-Player: ") + (title || "");
    frame.src = embed;
    if (album) {
      const parts = spotifyAlbumBox(embed, title);
      parts.holder.append(frame);
      placeSpotifyBox(parts.box);
    } else {
      frame.id = "spotify-frame";
      placeSpotifyBox(frame);
    }
    spotifyUsed = true;
    document.body.classList.add("spotify-mode");
    updatePlayerHeight();
    return frame;
  }

  /* Spotify iFrame API: steuert den eingebetteten Player, damit eine Folge beim Antippen
     sofort startet. Wird erst geladen, wenn eine Spotify-Serie geöffnet wird. Klappt das
     nicht, gibt es den normalen eingebetteten Player (dann einmal auf Play tippen). */
  let spotifyApi = null;        // IFrameAPI, sobald geladen
  let spotifyApiLoading = null; // Promise während des Ladens
  let spotifyController = null;
  let spotifyWantsPlay = false;

  function loadSpotifyApi() {
    if (spotifyApi) return Promise.resolve(spotifyApi);
    if (spotifyApiLoading) return spotifyApiLoading;
    spotifyApiLoading = new Promise(function (resolve, reject) {
      const timer = setTimeout(function () { reject(new Error("Zeitüberschreitung")); }, 8000);
      window.onSpotifyIframeApiReady = function (api) {
        clearTimeout(timer);
        spotifyApi = api;
        resolve(api);
      };
      const script = document.createElement("script");
      script.src = "https://open.spotify.com/embed/iframe-api/v1";
      script.async = true;
      script.onerror = function () { clearTimeout(timer); reject(new Error("nicht geladen")); };
      document.head.append(script);
    });
    spotifyApiLoading.catch(function () { spotifyApiLoading = null; });
    return spotifyApiLoading;
  }

  // "https://open.spotify.com/embed/album/ID" -> "spotify:album:ID"
  function spotifyUri(embed) {
    const m = /\/embed\/(album|artist|show|playlist|episode|track)\/([A-Za-z0-9]+)/.exec(embed);
    return m ? "spotify:" + m[1] + ":" + m[2] : null;
  }

  function playInController(uri) {
    spotifyWantsPlay = true;
    spotifyController.loadUri(uri);
    spotifyController.play();
  }

  function showSpotifyControlled(uri, embed, title) {
    audio.pause();
    spotifyUsed = true;
    document.body.classList.add("spotify-mode");

    if (spotifyController && $("spotify-frame") && $("spotify-open")) {
      $("spotify-frame").title = "Spotify-Player: " + (title || "");
      $("spotify-open").href = spotifyOpenUrl(embed);
      playInController(uri);
      return;
    }

    const parts = spotifyAlbumBox(embed, title);
    const box = parts.box;
    const target = el("div");
    parts.holder.append(target);
    placeSpotifyBox(box);
    updatePlayerHeight();

    spotifyWantsPlay = true;
    spotifyApi.createController(target, { uri: uri, width: "100%", height: 152 }, function (controller) {
      // Detailansicht inzwischen verlassen?
      if (!box.isConnected) { controller.destroy(); return; }
      spotifyController = controller;
      const frame = box.querySelector("iframe");
      if (frame) frame.allow = "autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture";
      controller.addListener("ready", function () {
        if (spotifyWantsPlay) controller.play();
      });
      controller.addListener("playback_update", function (e) {
        if (e && e.data && !e.data.isPaused) spotifyWantsPlay = false;
      });
      controller.play();
    });
  }

  function openSpotifyEpisode(pi, ei) {
    const ep = podcasts[pi].episodes[ei];
    const embed = embedUrl(ep.embed_url);
    if (!embed) return;
    // Aus der Suche: erst zur Detailansicht des Podcasts wechseln
    if (location.hash !== "#podcast-" + pi) {
      pendingSpotify = { pi: pi, ei: ei };
      location.hash = "podcast-" + pi;
      return;
    }
    spotifyCurrent = { pi: pi, ei: ei };
    const uri = isApple(embed) ? null : spotifyUri(embed);
    if (spotifyApi && uri) {
      showSpotifyControlled(uri, embed, ep.title);
    } else {
      showSpotify(embed, ep.title, true);
    }
    updateCards();
  }

  // Nur echte Player-Adressen von Spotify und Apple Music zulassen
  function embedUrl(value) {
    const url = safeUrl(value);
    return url && /^https:\/\/(open\.spotify\.com\/embed\/|embed\.music\.apple\.com\/)/.test(url) ? url : null;
  }

  function isApple(embed) {
    return embed.indexOf("https://embed.music.apple.com/") === 0;
  }

  function removeSpotify() {
    if (spotifyController) {
      try { spotifyController.destroy(); } catch (e) { /* schon weg */ }
      spotifyController = null;
    }
    spotifyWantsPlay = false;
    const frame = $("spotify-frame");
    if (frame) frame.remove();
    spotifyCurrent = null;
    document.body.classList.remove("spotify-mode");
    updatePlayerHeight();
  }

  /* ---------- Player ---------- */

  function isCurrent(pi, ei) {
    return current && current.podcastIndex === pi && current.episodeIndex === ei;
  }

  function playEpisode(pi, ei) {
    if (isCurrent(pi, ei)) {
      togglePlay();
      return;
    }
    const p = podcasts[pi];
    const ep = p.episodes[ei];
    current = { podcastIndex: pi, episodeIndex: ei };

    $("player-cover").replaceChildren(cover(episodeImage(p, ep)));
    $("player-title").textContent = episodeName(p, ep);
    $("player-error").hidden = true;
    playerEl.hidden = false;
    updatePlayerHeight();

    audio.src = safeUrl(ep.audio_url);
    setProgress(0);
    updateTimes(0);
    audio.play().catch(function () { /* z. B. Autoplay blockiert – Nutzer tippt auf Play */ });

    if ("mediaSession" in navigator) {
      const art = episodeImage(p, ep);
      navigator.mediaSession.metadata = new MediaMetadata({
        title: episodeName(p, ep),
        artist: showName(p),
        artwork: art ? [{ src: art, sizes: "512x512" }] : []
      });
    }
    updateCards();
  }

  function togglePlay() {
    if (!audio.src) return;
    if (audio.paused) {
      audio.play().catch(function () {});
    } else {
      audio.pause();
    }
  }

  function skip(seconds) {
    if (!audio.src || !isFinite(audio.duration)) return;
    audio.currentTime = Math.max(0, Math.min(audio.duration, audio.currentTime + seconds));
  }

  function setProgress(fraction) {
    const value = Math.round(fraction * 1000);
    seekEl.value = value;
    seekEl.style.setProperty("--p", (value / 10) + "%");
  }

  function formatTime(seconds) {
    if (!isFinite(seconds) || seconds < 0) return "–:––";
    seconds = Math.floor(seconds);
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    const sec = String(seconds % 60).padStart(2, "0");
    return h ? h + ":" + String(m).padStart(2, "0") + ":" + sec : m + ":" + sec;
  }

  // Links die vergangene Zeit, rechts die Restzeit
  function updateTimes(position) {
    const duration = audio.duration;
    const pos = position != null ? position : audio.currentTime || 0;
    $("time-elapsed").textContent = formatTime(pos);
    $("time-remaining").textContent = isFinite(duration) && duration > 0
      ? "-" + formatTime(Math.max(0, duration - pos))
      : "–:––";
  }

  function updatePlayButton() {
    const playing = !audio.paused && !audio.ended;
    $("icon-play").toggleAttribute("hidden", playing);
    $("icon-pause").toggleAttribute("hidden", !playing);
    toggleBtn.setAttribute("aria-label", playing ? "Pause" : "Abspielen");
    updateCards();
  }

  // Aktive Folge hervorheben und Symbol auf der Karte anpassen
  function updateCards() {
    const playing = !audio.paused && !audio.ended;
    document.querySelectorAll(".episode").forEach(function (card) {
      const pi = Number(card.dataset.podcast);
      const ei = Number(card.dataset.episode);
      const active = isCurrent(pi, ei) ||
        Boolean(spotifyCurrent && spotifyCurrent.pi === pi && spotifyCurrent.ei === ei);
      card.classList.toggle("active", active);
      card.setAttribute("aria-label",
        (active && playing ? "Pause: " : "Abspielen: ") + card.querySelector("h3").textContent);
      // Nur feste, eigene SVG-Symbole – keine Feed-Inhalte
      card.querySelector(".badge").innerHTML = active && playing ? PAUSE_SVG : PLAY_SVG;
    });
  }

  // Querformat auf dem Tablet: Player ist eine Seitenleiste statt unten
  const sidebarQuery = window.matchMedia("(min-width: 900px) and (orientation: landscape)");

  function updatePlayerHeight() {
    const albumFrame = document.querySelector(".spotify-frame.album");
    const playerShown = !playerEl.hidden && !document.body.classList.contains("spotify-mode");
    document.body.classList.toggle("has-player", playerShown && !albumFrame);
    const h = albumFrame ? albumFrame.offsetHeight
      : !playerShown || sidebarQuery.matches ? 0 : playerEl.offsetHeight;
    document.documentElement.style.setProperty("--player-h", h + "px");
  }
  if (sidebarQuery.addEventListener) sidebarQuery.addEventListener("change", updatePlayerHeight);

  toggleBtn.addEventListener("click", togglePlay);
  $("rewind").addEventListener("click", function () { skip(-15); });
  $("forward").addEventListener("click", function () { skip(15); });

  audio.addEventListener("play", updatePlayButton);
  audio.addEventListener("pause", updatePlayButton);
  audio.addEventListener("ended", updatePlayButton);
  audio.addEventListener("timeupdate", function () {
    if (seeking) return;
    if (audio.duration) setProgress(audio.currentTime / audio.duration);
    updateTimes();
  });
  audio.addEventListener("loadedmetadata", function () { updateTimes(); });
  audio.addEventListener("durationchange", function () { updateTimes(); });
  audio.addEventListener("error", function () {
    if (audio.getAttribute("src")) $("player-error").hidden = false;
    updatePlayButton();
  });

  seekEl.addEventListener("input", function () {
    seeking = true;
    seekEl.style.setProperty("--p", (seekEl.value / 10) + "%");
    // Beim Ziehen schon die Zielzeit anzeigen
    if (isFinite(audio.duration)) updateTimes((seekEl.value / 1000) * audio.duration);
  });
  seekEl.addEventListener("change", function () {
    if (isFinite(audio.duration)) audio.currentTime = (seekEl.value / 1000) * audio.duration;
    seeking = false;
    updateTimes();
  });

  if ("mediaSession" in navigator) {
    navigator.mediaSession.setActionHandler("play", togglePlay);
    navigator.mediaSession.setActionHandler("pause", togglePlay);
    navigator.mediaSession.setActionHandler("seekbackward", function () { skip(-15); });
    navigator.mediaSession.setActionHandler("seekforward", function () { skip(15); });
  }
  window.addEventListener("resize", updatePlayerHeight);

  /* ---------- Navigation ---------- */

  // Ansicht über das URL-Fragment (#podcast-3), damit der Zurück-Button des Browsers funktioniert
  function route() {
    closeLayer();
    // Einträge, die per Browser-Zurück verlassen wurden, vergessen
    while (navStack.length && navStack[navStack.length - 1].to !== location.hash) navStack.pop();

    const match = /^#podcast-(\d+)$/.exec(location.hash);
    const index = match ? Number(match[1]) : -1;
    const section = location.hash.slice(1);

    if (podcasts[index]) {
      view = "detail";
      renderDetail(index);
      overviewEl.hidden = true;
      detailEl.hidden = false;
      document.title = showName(podcasts[index]) + " – SpotiMy";
      window.scrollTo(0, 0);
      $("back").focus({ preventScroll: true });
    } else {
      removeSpotify(); // stoppt auch die Spotify-Wiedergabe
      spotifyUsed = false;
      view = SECTIONS[section] && sectionHas(section) ? section : "menu";
      detailEl.hidden = true;
      overviewEl.hidden = false;
      $("section-head").hidden = view === "menu";
      $("search-form").hidden = view === "spiele";
      if (view === "menu") {
        renderMenu();
        document.title = "SpotiMy";
      } else {
        $("section-title").textContent = SECTIONS[view].title;
        renderOverview(view);
        document.title = SECTIONS[view].title + " – SpotiMy";
      }
      if (view === "spiele") searchInput.value = "";
      runSearch();
      window.scrollTo(0, 0);
    }
  }

  // Übergeordnete Ansicht: Folgenliste -> Bereich -> Hauptmenü
  function parentHash() {
    const match = /^#podcast-(\d+)$/.exec(location.hash);
    if (match && podcasts[Number(match[1])]) return "#" + sectionOf(podcasts[Number(match[1])]);
    return "";
  }

  function goBack() {
    const parent = parentHash();
    const top = navStack[navStack.length - 1];
    if (top && top.to === location.hash && top.from === parent && !spotifyUsed) {
      navStack.pop();
      history.back();
    } else {
      // Kein passender Eintrag im Verlauf (Seite direkt geöffnet, oder ein eingebetteter
      // Player hat eigene Einträge angelegt): Eintrag direkt durch die Elternansicht ersetzen.
      history.replaceState(null, "", location.pathname + location.search + parent);
      route();
    }
  }

  $("back").addEventListener("click", goBack);
  $("section-back").addEventListener("click", goBack);
  window.addEventListener("hashchange", route);

  function showError(message, hint) {
    const box = el("div", "notice", message);
    if (hint) box.append(el("p", null, hint));
    gridEl.replaceWith(box);
  }

  fetch("data/podcasts.json", { cache: "no-cache" })
    .then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    })
    .then(function (data) {
      podcasts = Array.isArray(data && data.podcasts) ? data.podcasts : [];
      if (!podcasts.length) {
        showError("Noch keine Podcasts da.",
          "Feed-Adressen in feeds.txt eintragen und „python update_feeds.py“ ausführen.");
        return;
      }
      buildSearchIndex();
      route();
    })
    .catch(function () {
      if (location.protocol === "file:") {
        showError("Bitte über einen Webserver öffnen.",
          "Im Projektordner „python -m http.server“ starten und http://localhost:8000 öffnen.");
      } else {
        showError("Die Podcasts konnten nicht geladen werden.",
          "Bitte zuerst „python update_feeds.py“ ausführen.");
      }
    });
})();
</script>
</body>
</html>
