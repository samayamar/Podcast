<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline' https://open.spotify.com https://open.spotifycdn.com; style-src 'unsafe-inline'; img-src https: http: data:; media-src https: http:; frame-src https://open.spotify.com">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#fff4d6">
<title>SpotiMy</title>
<style>
  :root {
    color-scheme: light;
    --bg: #fff4d6;
    --ink: #2b2147;
    --purple: #6a4cff;
    --purple-dark: #4b32c9;
    --yellow: #ffcf33;
    --white: #ffffff;
    --c1: #ff7a3d;
    --c2: #20b8a6;
    --c3: #ff4f8b;
    --c4: #6a4cff;
    --c5: #3fae49;
    --c6: #2f8cff;
    --radius: 24px;
    --shadow: 0 6px 0 rgba(43, 33, 71, .18);
    --player-h: 0px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Nunito", system-ui, sans-serif;
    background:
      radial-gradient(circle at 10% 0%, #ffe59a 0 120px, transparent 121px),
      radial-gradient(circle at 95% 8%, #ffd9e6 0 90px, transparent 91px),
      var(--bg);
    background-attachment: fixed;
    color: var(--ink);
    line-height: 1.3;
    padding-bottom: calc(var(--player-h) + 24px);
  }
  header, main { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
  header { padding-top: 20px; }
  h1 { margin: 0; font-size: 2rem; letter-spacing: .5px; color: var(--purple); }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; }
  img { -webkit-user-drag: none; }

  /* Cover und Platzhalter */
  .cover {
    display: block;
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border-radius: calc(var(--radius) - 8px);
    background: #ffe7a8;
  }
  .placeholder {
    background:
      radial-gradient(circle at 50% 45%, #fff 0 14%, transparent 15%),
      radial-gradient(circle at 50% 45%, var(--yellow) 0 30%, transparent 31%),
      linear-gradient(135deg, #ffe7a8, #ffc0d6);
  }

  /* Startseite: Kacheln */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
    padding: 20px 0 32px;
  }
  .tile {
    border: 0;
    border-radius: var(--radius);
    padding: 12px 12px 16px;
    background: var(--tile, var(--c1));
    color: var(--white);
    box-shadow: var(--shadow);
    cursor: pointer;
    text-align: center;
    transition: transform .12s, box-shadow .12s;
  }
  .tile:hover { transform: translateY(-3px) rotate(-.5deg); }
  .tile:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(43, 33, 71, .18); }
  .tile:focus-visible, .episode:focus-visible, .round:focus-visible, .back:focus-visible {
    outline: 4px solid var(--purple-dark);
    outline-offset: 3px;
  }
  .tile h2 {
    margin: 12px 4px 0;
    font-size: 1.25rem;
    line-height: 1.2;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  /* Detailansicht */
  .detail-head { display: flex; align-items: center; gap: 14px; margin: 16px 0 8px; }
  .back {
    flex: none;
    width: 56px; height: 56px;
    border: 0; border-radius: 50%;
    background: var(--white);
    color: var(--purple);
    font-size: 1.8rem; font-weight: 700;
    box-shadow: var(--shadow);
    cursor: pointer;
  }
  .back:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(43, 33, 71, .18); }
  .detail-head .cover { width: 64px; flex: none; border-radius: 16px; }
  .detail-head h2 { margin: 0; font-size: 1.5rem; line-height: 1.2; }

  .episodes {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 16px;
    list-style: none;
    margin: 12px 0 0; padding: 0;
  }
  .episode {
    position: relative;
    width: 100%;
    min-width: 0;
    border: 0;
    border-radius: var(--radius);
    padding: 8px 8px 12px;
    background: var(--white);
    box-shadow: var(--shadow);
    cursor: pointer;
    text-align: center;
    transition: transform .12s;
  }
  .episode:active { transform: translateY(3px); }
  .episode .thumb { position: relative; }
  .episode .badge {
    position: absolute; right: 8px; bottom: 8px;
    width: 52px; height: 52px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--yellow); color: var(--ink);
    border: 3px solid var(--white);
    box-shadow: 0 3px 0 rgba(43, 33, 71, .25);
  }
  .episode .badge svg { width: 26px; height: 26px; }
  .episode h3 {
    margin: 10px 4px 0;
    font-size: 1rem;
    line-height: 1.25;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .episode.active { background: var(--yellow); box-shadow: 0 0 0 4px var(--purple), var(--shadow); }
  .episode.active .badge { background: var(--purple); color: var(--white); }

  /* Großer Player, unten fixiert */
  .player {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 10;
    padding: 12px 16px calc(14px + env(safe-area-inset-bottom));
    background: var(--purple);
    color: var(--white);
    border-radius: 28px 28px 0 0;
    box-shadow: 0 -6px 24px rgba(43, 33, 71, .25);
  }
  .player-inner { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 16px; }
  .player .cover { width: 96px; flex: none; border-radius: 18px; }
  .player-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
  .player-title {
    margin: 0; font-size: 1.15rem; font-weight: 700;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .controls { display: flex; align-items: center; justify-content: center; gap: 18px; }
  .round {
    border: 0; border-radius: 50%;
    display: grid; place-items: center;
    cursor: pointer;
    background: rgba(255, 255, 255, .18);
    color: var(--white);
    width: 60px; height: 60px;
  }
  .round svg { width: 30px; height: 30px; }
  .round:active { transform: scale(.94); }
  .round.play {
    width: 84px; height: 84px;
    background: var(--yellow); color: var(--ink);
    box-shadow: 0 5px 0 rgba(0, 0, 0, .25);
  }
  .round.play svg { width: 42px; height: 42px; }
  .round.play:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0, 0, 0, .25); }

  .seek {
    --p: 0%;
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 14px; margin: 0;
    border-radius: 7px;
    background: linear-gradient(to right, var(--yellow) var(--p), rgba(255, 255, 255, .3) var(--p));
    cursor: pointer;
  }
  .seek::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--white); border: 4px solid var(--yellow);
  }
  .seek::-moz-range-thumb {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--white); border: 4px solid var(--yellow);
  }
  .times {
    display: flex; justify-content: space-between;
    margin-top: -2px;
    font-size: 1rem; font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .player-error { margin: 0; font-weight: 700; color: var(--yellow); }

  /* Suche */
  .search {
    position: relative;
    margin: 18px 0 0;
  }
  .search input {
    width: 100%;
    font: inherit;
    font-size: 1.2rem;
    color: var(--ink);
    padding: 16px 60px 16px 56px;
    border: 4px solid var(--white);
    border-radius: 999px;
    background: var(--white);
    box-shadow: var(--shadow);
    outline: none;
    -webkit-appearance: none; appearance: none;
  }
  .search input:focus { border-color: var(--purple); }
  .search input::placeholder { color: #8a83a3; }
  .search input::-webkit-search-cancel-button { display: none; }
  .search .icon {
    position: absolute; left: 20px; top: 50%; transform: translateY(-50%);
    width: 26px; height: 26px; color: var(--purple); pointer-events: none;
  }
  .search .clear {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    width: 44px; height: 44px; border: 0; border-radius: 50%;
    background: var(--bg); color: var(--ink);
    font-size: 1.4rem; font-weight: 700; cursor: pointer;
  }
  .results-info { margin: 18px 4px 0; font-size: 1.1rem; font-weight: 700; color: var(--purple); }
  .episode .from {
    display: block; margin: 4px 4px 0;
    font-size: .8rem; font-weight: 700; color: var(--from, var(--purple));
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .episode.active .from { color: var(--ink); }

  /* Eingebetteter Spotify-Player; dort den eigenen Player ausblenden */
  body.spotify-mode .player { display: none; }
  .spotify-frame {
    display: block;
    width: 100%;
    height: 560px;
    max-height: calc(100vh - 160px);
    min-height: 352px;
    margin-top: 12px;
    border: 0;
    border-radius: var(--radius);
    background: var(--white);
    box-shadow: var(--shadow);
  }
  /* Spotify-Folge: kompakter Spotify-Player unten fest, wie der eigene Player */
  .spotify-frame.album iframe { display: block; width: 100%; height: 100%; border: 0; }
  .spotify-frame.album {
    overflow: hidden;
    position: fixed;
    left: 50%; bottom: 0; z-index: 10;
    transform: translateX(-50%);
    width: min(100%, 1100px);
    height: 152px; min-height: 0; max-height: none;
    margin: 0;
    border-radius: 20px 20px 0 0;
    box-shadow: 0 -6px 24px rgba(43, 33, 71, .25);
  }
  .tile .tag {
    display: inline-block;
    margin-top: 6px;
    padding: 2px 10px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .25);
    font-size: .85rem; font-weight: 700;
  }

  .notice {
    background: var(--white);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px;
    margin: 20px 0;
    font-size: 1.1rem;
  }
  .notice p { margin: 8px 0 0; font-size: 1rem; }

  @media (max-width: 600px) {
    h1 { font-size: 1.7rem; }
    .grid { grid-template-columns: 1fr; gap: 16px; }
    .tile { display: flex; align-items: center; gap: 14px; text-align: left; padding: 10px; }
    .tile .cover { width: 96px; flex: none; }
    .tile h2 { margin: 0; font-size: 1.3rem; }
    .episodes { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .episode .badge { width: 44px; height: 44px; }
    .player-inner { flex-direction: column; gap: 10px; }
    .player .cover { display: none; }
    .player-main { width: 100%; }
    .player-title { text-align: center; }
  }
</style>
</head>
<body>
<header>
  <h1>🎧 SpotiMy</h1>
</header>

<main>
  <section id="overview" aria-label="Podcasts">
    <form class="search" id="search-form" role="search" hidden>
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.5-4.5"/></svg>
      <input type="search" id="search" placeholder="Suchen …" aria-label="Folgen in allen Podcasts suchen" autocomplete="off" enterkeyhint="search">
      <button type="button" class="clear" id="search-clear" aria-label="Suche löschen" hidden>×</button>
    </form>
    <div class="grid" id="grid"></div>
    <div id="results" hidden>
      <p class="results-info" id="results-info" aria-live="polite"></p>
      <ul class="episodes" id="results-list"></ul>
    </div>
  </section>

  <section id="detail" hidden>
    <div class="detail-head">
      <button type="button" class="back" id="back" aria-label="Zurück zur Übersicht">←</button>
      <div id="detail-cover"></div>
      <h2 id="detail-title"></h2>
    </div>
    <ul class="episodes" id="episodes"></ul>
  </section>
</main>

<div class="player" id="player" hidden aria-label="Player">
  <div class="player-inner">
    <div id="player-cover"></div>
    <div class="player-main">
      <p class="player-title" id="player-title"></p>
      <p class="player-error" id="player-error" hidden>Diese Folge kann gerade nicht abgespielt werden.</p>
      <div class="controls">
        <button type="button" class="round" id="rewind" aria-label="15 Sekunden zurück">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        </button>
        <button type="button" class="round play" id="toggle" aria-label="Abspielen">
          <svg viewBox="0 0 24 24" fill="currentColor" id="icon-play"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l11-6.5a1 1 0 0 0 0-1.72l-11-6.5A1 1 0 0 0 8 5.5z"/></svg>
          <svg viewBox="0 0 24 24" fill="currentColor" id="icon-pause" hidden><rect x="6" y="4.5" width="4.5" height="15" rx="1.5"/><rect x="13.5" y="4.5" width="4.5" height="15" rx="1.5"/></svg>
        </button>
        <button type="button" class="round" id="forward" aria-label="15 Sekunden vor">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
        </button>
      </div>
      <input type="range" class="seek" id="seek" min="0" max="1000" value="0" aria-label="Position in der Folge">
      <div class="times">
        <span id="time-elapsed" aria-label="Vergangene Zeit">0:00</span>
        <span id="time-remaining" aria-label="Restzeit">–:––</span>
      </div>
    </div>
  </div>
  <audio id="audio" preload="none"></audio>
</div>

<script>
(function () {
  "use strict";

  const TILE_COLORS = ["--c1", "--c2", "--c3", "--c4", "--c5", "--c6"];
  const PLAY_SVG = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l11-6.5a1 1 0 0 0 0-1.72l-11-6.5A1 1 0 0 0 8 5.5z"/></svg>';
  const PAUSE_SVG = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="4.5" width="4.5" height="15" rx="1.5"/><rect x="13.5" y="4.5" width="4.5" height="15" rx="1.5"/></svg>';

  const $ = function (id) { return document.getElementById(id); };
  const gridEl = $("grid");
  const overviewEl = $("overview");
  const detailEl = $("detail");
  const episodesEl = $("episodes");
  const playerEl = $("player");
  const audio = $("audio");
  const toggleBtn = $("toggle");
  const seekEl = $("seek");

  let podcasts = [];
  let lastTile = null;
  let current = null; // { podcastIndex, episodeIndex }
  let spotifyCurrent = null; // im Spotify-Player geöffnete Folge { pi, ei }
  let pendingSpotify = null; // aus der Suche gewählte Spotify-Folge
  let spotifyUsed = false; // in dieser Detailansicht wurde ein Spotify-Player geladen
  let seeking = false;

  // Element mit reinem Text erzeugen (Feed-Inhalte nie als HTML einfügen)
  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }

  // Nur http(s)-Adressen zulassen
  function safeUrl(value) {
    if (typeof value !== "string" || !value) return null;
    try {
      const url = new URL(value, location.href);
      return url.protocol === "https:" || url.protocol === "http:" ? url.href : null;
    } catch (e) {
      return null;
    }
  }

  function cover(src) {
    const url = safeUrl(src);
    if (!url) {
      const ph = el("div", "cover placeholder");
      ph.setAttribute("aria-hidden", "true");
      return ph;
    }
    const img = el("img", "cover");
    img.src = url;
    img.alt = "";
    img.loading = "lazy";
    img.decoding = "async";
    img.referrerPolicy = "no-referrer";
    img.addEventListener("error", function () { img.replaceWith(cover(null)); }, { once: true });
    return img;
  }

  // Bild der Folge, sonst das Cover des Podcasts
  function episodeImage(p, ep) {
    return safeUrl(ep.image) || safeUrl(p.image);
  }

  /* ---------- Startseite ---------- */

  function renderOverview() {
    gridEl.replaceChildren();
    podcasts.forEach(function (p, index) {
      const tile = el("button", "tile");
      tile.type = "button";
      tile.style.setProperty("--tile", "var(" + TILE_COLORS[index % TILE_COLORS.length] + ")");
      const name = el("div");
      name.append(el("h2", null, p.title || "Podcast"));
      if (p.type === "spotify") name.append(el("span", "tag", "Spotify"));
      tile.append(cover(p.image), name);
      tile.addEventListener("click", function () {
        lastTile = tile;
        location.hash = "podcast-" + index;
      });
      gridEl.append(tile);
    });
  }

  /* ---------- Folgen-Kachel (Detailansicht und Suche) ---------- */

  function episodeCard(pi, ei, showPodcast) {
    const p = podcasts[pi];
    const ep = p.episodes[ei];
    const li = el("li");
    const card = el("button", "episode");
    card.type = "button";
    card.dataset.podcast = pi;
    card.dataset.episode = ei;

    const thumb = el("div", "thumb");
    thumb.append(cover(episodeImage(p, ep)));
    const badge = el("span", "badge");
    badge.setAttribute("aria-hidden", "true");
    thumb.append(badge);

    card.append(thumb, el("h3", null, ep.title || "Folge"));
    if (showPodcast) {
      const from = el("span", "from", p.title || "");
      from.style.setProperty("--from", "var(" + TILE_COLORS[pi % TILE_COLORS.length] + ")");
      card.append(from);
    }
    card.addEventListener("click", function () {
      if (safeUrl(ep.audio_url)) playEpisode(pi, ei);
      else openSpotifyEpisode(pi, ei);
    });
    li.append(card);
    return li;
  }

  /* ---------- Suche über alle Podcasts ---------- */

  const searchInput = $("search");
  const resultsEl = $("results");
  const resultsList = $("results-list");
  let searchIndex = [];

  // Kleinschreibung, Umlaute/Akzente vereinheitlichen: "Mäuse" findet auch "mause"
  function normalize(text) {
    return String(text || "").toLowerCase()
      .replace(/ß/g, "ss")
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  }

  function buildSearchIndex() {
    searchIndex = [];
    podcasts.forEach(function (p, pi) {
      (p.episodes || []).forEach(function (ep, ei) {
        if (!isPlayable(ep)) return;
        searchIndex.push({
          pi: pi, ei: ei,
          title: normalize(ep.title),
          text: normalize([ep.title, ep.summary, p.title].join(" "))
        });
      });
    });
  }

  function runSearch() {
    const query = normalize(searchInput.value).trim();
    $("search-clear").hidden = !query;
    if (!query) {
      resultsEl.hidden = true;
      gridEl.hidden = false;
      resultsList.replaceChildren();
      return;
    }
    const words = query.split(/\s+/);
    const hits = searchIndex
      .filter(function (e) { return words.every(function (w) { return e.text.includes(w); }); })
      // Treffer im Titel zuerst
      .sort(function (a, b) {
        const at = words.every(function (w) { return a.title.includes(w); });
        const bt = words.every(function (w) { return b.title.includes(w); });
        return (bt - at) || a.pi - b.pi || a.ei - b.ei;
      });

    gridEl.hidden = true;
    resultsEl.hidden = false;
    resultsList.replaceChildren();
    $("results-info").textContent = hits.length
      ? (hits.length === 1 ? "1 Folge gefunden" : hits.length + " Folgen gefunden")
      : "Nichts gefunden 🙈";
    hits.forEach(function (h) { resultsList.append(episodeCard(h.pi, h.ei, true)); });
    updateCards();
  }

  searchInput.addEventListener("input", runSearch);
  $("search-form").addEventListener("submit", function (e) {
    e.preventDefault();
    searchInput.blur(); // Tastatur auf dem Handy schließen
  });
  $("search-clear").addEventListener("click", function () {
    searchInput.value = "";
    runSearch();
    searchInput.focus();
  });

  /* ---------- Detailansicht ---------- */

  function renderDetail(index) {
    const p = podcasts[index];
    $("detail-cover").replaceChildren(cover(p.image));
    $("detail-title").textContent = p.title || "Podcast";

    episodesEl.replaceChildren();
    removeSpotify();

    (p.episodes || []).slice(0, 20).forEach(function (ep, i) {
      if (isPlayable(ep)) episodesEl.append(episodeCard(index, i, false));
    });

    // Spotify ohne einzelne Folgen: Spotify-Player des Künstlers zeigen.
    // Er wird erst jetzt geladen – keine Spotify-Inhalte auf der Startseite.
    if (p.type === "spotify" && !episodesEl.children.length) {
      const embed = spotifyEmbedUrl(p.embed_url);
      if (embed) showSpotify(embed, p.title, false);
      return;
    }

    if (!episodesEl.children.length) {
      episodesEl.append(el("li", "notice", "Hier gibt es noch keine Folgen."));
    }

    // Spotify-Steuerung schon vorladen, damit die Folge beim Antippen sofort startet
    if (p.type === "spotify") {
      const pending = pendingSpotify && pendingSpotify.pi === index ? pendingSpotify : null;
      pendingSpotify = null;
      loadSpotifyApi()
        .catch(function () { /* dann normaler eingebetteter Player */ })
        .then(function () {
          // Aus der Suche heraus gewählte Folge öffnen (falls noch in dieser Ansicht)
          if (pending && location.hash === "#podcast-" + index) openSpotifyEpisode(pending.pi, pending.ei);
        });
    }
    updateCards();
  }

  function isPlayable(ep) {
    return Boolean(safeUrl(ep.audio_url) || spotifyEmbedUrl(ep.embed_url));
  }

  // Spotify-Player über der Folgenliste anzeigen (bzw. die Folge darin wechseln)
  function showSpotify(embed, title, album) {
    audio.pause(); // nicht zwei Player gleichzeitig
    // Immer ein neues iframe statt src zu ändern – das hält den Browserverlauf sauber
    const old = $("spotify-frame");
    const frame = el("iframe", "spotify-frame");
    frame.id = "spotify-frame";
    frame.allow = "autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture";
    frame.classList.toggle("album", album);
    frame.title = "Spotify-Player: " + (title || "");
    frame.src = embed;
    if (old) old.replaceWith(frame);
    else detailEl.insertBefore(frame, episodesEl);
    spotifyUsed = true;
    document.body.classList.add("spotify-mode");
    updatePlayerHeight();
    return frame;
  }

  /* Spotify iFrame API: steuert den eingebetteten Player, damit eine Folge beim Antippen
     sofort startet. Wird erst geladen, wenn eine Spotify-Serie geöffnet wird. Klappt das
     nicht, gibt es den normalen eingebetteten Player (dann einmal auf Play tippen). */
  let spotifyApi = null;        // IFrameAPI, sobald geladen
  let spotifyApiLoading = null; // Promise während des Ladens
  let spotifyController = null;
  let spotifyWantsPlay = false;

  function loadSpotifyApi() {
    if (spotifyApi) return Promise.resolve(spotifyApi);
    if (spotifyApiLoading) return spotifyApiLoading;
    spotifyApiLoading = new Promise(function (resolve, reject) {
      const timer = setTimeout(function () { reject(new Error("Zeitüberschreitung")); }, 8000);
      window.onSpotifyIframeApiReady = function (api) {
        clearTimeout(timer);
        spotifyApi = api;
        resolve(api);
      };
      const script = document.createElement("script");
      script.src = "https://open.spotify.com/embed/iframe-api/v1";
      script.async = true;
      script.onerror = function () { clearTimeout(timer); reject(new Error("nicht geladen")); };
      document.head.append(script);
    });
    spotifyApiLoading.catch(function () { spotifyApiLoading = null; });
    return spotifyApiLoading;
  }

  // "https://open.spotify.com/embed/album/ID" -> "spotify:album:ID"
  function spotifyUri(embed) {
    const m = /\/embed\/(album|artist|show|playlist|episode|track)\/([A-Za-z0-9]+)/.exec(embed);
    return m ? "spotify:" + m[1] + ":" + m[2] : null;
  }

  function playInController(uri) {
    spotifyWantsPlay = true;
    spotifyController.loadUri(uri);
    spotifyController.play();
  }

  function showSpotifyControlled(uri, title) {
    audio.pause();
    spotifyUsed = true;
    document.body.classList.add("spotify-mode");

    if (spotifyController && $("spotify-frame")) {
      $("spotify-frame").title = "Spotify-Player: " + (title || "");
      playInController(uri);
      return;
    }

    const old = $("spotify-frame");
    const box = el("div", "spotify-frame album");
    box.id = "spotify-frame";
    box.title = "Spotify-Player: " + (title || "");
    const target = el("div");
    box.append(target);
    if (old) old.replaceWith(box);
    else detailEl.insertBefore(box, episodesEl);
    updatePlayerHeight();

    spotifyWantsPlay = true;
    spotifyApi.createController(target, { uri: uri, width: "100%", height: 152 }, function (controller) {
      // Detailansicht inzwischen verlassen?
      if (!box.isConnected) { controller.destroy(); return; }
      spotifyController = controller;
      const frame = box.querySelector("iframe");
      if (frame) frame.allow = "autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture";
      controller.addListener("ready", function () {
        if (spotifyWantsPlay) controller.play();
      });
      controller.addListener("playback_update", function (e) {
        if (e && e.data && !e.data.isPaused) spotifyWantsPlay = false;
      });
      controller.play();
    });
  }

  function openSpotifyEpisode(pi, ei) {
    const ep = podcasts[pi].episodes[ei];
    const embed = spotifyEmbedUrl(ep.embed_url);
    if (!embed) return;
    // Aus der Suche: erst zur Detailansicht des Podcasts wechseln
    if (location.hash !== "#podcast-" + pi) {
      pendingSpotify = { pi: pi, ei: ei };
      location.hash = "podcast-" + pi;
      return;
    }
    spotifyCurrent = { pi: pi, ei: ei };
    const uri = spotifyUri(embed);
    if (spotifyApi && uri) {
      showSpotifyControlled(uri, ep.title);
    } else {
      showSpotify(embed, ep.title, true);
    }
    updateCards();
  }

  // Nur echte Spotify-Embed-Adressen zulassen
  function spotifyEmbedUrl(value) {
    const url = safeUrl(value);
    return url && /^https:\/\/open\.spotify\.com\/embed\//.test(url) ? url : null;
  }

  function removeSpotify() {
    if (spotifyController) {
      try { spotifyController.destroy(); } catch (e) { /* schon weg */ }
      spotifyController = null;
    }
    spotifyWantsPlay = false;
    const frame = $("spotify-frame");
    if (frame) frame.remove();
    spotifyCurrent = null;
    document.body.classList.remove("spotify-mode");
    updatePlayerHeight();
  }

  /* ---------- Player ---------- */

  function isCurrent(pi, ei) {
    return current && current.podcastIndex === pi && current.episodeIndex === ei;
  }

  function playEpisode(pi, ei) {
    if (isCurrent(pi, ei)) {
      togglePlay();
      return;
    }
    const p = podcasts[pi];
    const ep = p.episodes[ei];
    current = { podcastIndex: pi, episodeIndex: ei };

    $("player-cover").replaceChildren(cover(episodeImage(p, ep)));
    $("player-title").textContent = ep.title || "Folge";
    $("player-error").hidden = true;
    playerEl.hidden = false;
    updatePlayerHeight();

    audio.src = safeUrl(ep.audio_url);
    setProgress(0);
    updateTimes(0);
    audio.play().catch(function () { /* z. B. Autoplay blockiert – Nutzer tippt auf Play */ });

    if ("mediaSession" in navigator) {
      const art = episodeImage(p, ep);
      navigator.mediaSession.metadata = new MediaMetadata({
        title: ep.title || "Folge",
        artist: p.title || "",
        artwork: art ? [{ src: art, sizes: "512x512" }] : []
      });
    }
    updateCards();
  }

  function togglePlay() {
    if (!audio.src) return;
    if (audio.paused) {
      audio.play().catch(function () {});
    } else {
      audio.pause();
    }
  }

  function skip(seconds) {
    if (!audio.src || !isFinite(audio.duration)) return;
    audio.currentTime = Math.max(0, Math.min(audio.duration, audio.currentTime + seconds));
  }

  function setProgress(fraction) {
    const value = Math.round(fraction * 1000);
    seekEl.value = value;
    seekEl.style.setProperty("--p", (value / 10) + "%");
  }

  function formatTime(seconds) {
    if (!isFinite(seconds) || seconds < 0) return "–:––";
    seconds = Math.floor(seconds);
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    const sec = String(seconds % 60).padStart(2, "0");
    return h ? h + ":" + String(m).padStart(2, "0") + ":" + sec : m + ":" + sec;
  }

  // Links die vergangene Zeit, rechts die Restzeit
  function updateTimes(position) {
    const duration = audio.duration;
    const pos = position != null ? position : audio.currentTime || 0;
    $("time-elapsed").textContent = formatTime(pos);
    $("time-remaining").textContent = isFinite(duration) && duration > 0
      ? "-" + formatTime(Math.max(0, duration - pos))
      : "–:––";
  }

  function updatePlayButton() {
    const playing = !audio.paused && !audio.ended;
    $("icon-play").toggleAttribute("hidden", playing);
    $("icon-pause").toggleAttribute("hidden", !playing);
    toggleBtn.setAttribute("aria-label", playing ? "Pause" : "Abspielen");
    updateCards();
  }

  // Aktive Folge hervorheben und Symbol auf der Karte anpassen
  function updateCards() {
    const playing = !audio.paused && !audio.ended;
    document.querySelectorAll(".episode").forEach(function (card) {
      const pi = Number(card.dataset.podcast);
      const ei = Number(card.dataset.episode);
      const active = isCurrent(pi, ei) ||
        Boolean(spotifyCurrent && spotifyCurrent.pi === pi && spotifyCurrent.ei === ei);
      card.classList.toggle("active", active);
      card.setAttribute("aria-label",
        (active && playing ? "Pause: " : "Abspielen: ") + card.querySelector("h3").textContent);
      // Nur feste, eigene SVG-Symbole – keine Feed-Inhalte
      card.querySelector(".badge").innerHTML = active && playing ? PAUSE_SVG : PLAY_SVG;
    });
  }

  function updatePlayerHeight() {
    const albumFrame = document.querySelector(".spotify-frame.album");
    const h = albumFrame ? albumFrame.offsetHeight
      : playerEl.hidden || document.body.classList.contains("spotify-mode") ? 0 : playerEl.offsetHeight;
    document.documentElement.style.setProperty("--player-h", h + "px");
  }

  toggleBtn.addEventListener("click", togglePlay);
  $("rewind").addEventListener("click", function () { skip(-15); });
  $("forward").addEventListener("click", function () { skip(15); });

  audio.addEventListener("play", updatePlayButton);
  audio.addEventListener("pause", updatePlayButton);
  audio.addEventListener("ended", updatePlayButton);
  audio.addEventListener("timeupdate", function () {
    if (seeking) return;
    if (audio.duration) setProgress(audio.currentTime / audio.duration);
    updateTimes();
  });
  audio.addEventListener("loadedmetadata", function () { updateTimes(); });
  audio.addEventListener("durationchange", function () { updateTimes(); });
  audio.addEventListener("error", function () {
    if (audio.getAttribute("src")) $("player-error").hidden = false;
    updatePlayButton();
  });

  seekEl.addEventListener("input", function () {
    seeking = true;
    seekEl.style.setProperty("--p", (seekEl.value / 10) + "%");
    // Beim Ziehen schon die Zielzeit anzeigen
    if (isFinite(audio.duration)) updateTimes((seekEl.value / 1000) * audio.duration);
  });
  seekEl.addEventListener("change", function () {
    if (isFinite(audio.duration)) audio.currentTime = (seekEl.value / 1000) * audio.duration;
    seeking = false;
    updateTimes();
  });

  if ("mediaSession" in navigator) {
    navigator.mediaSession.setActionHandler("play", togglePlay);
    navigator.mediaSession.setActionHandler("pause", togglePlay);
    navigator.mediaSession.setActionHandler("seekbackward", function () { skip(-15); });
    navigator.mediaSession.setActionHandler("seekforward", function () { skip(15); });
  }
  window.addEventListener("resize", updatePlayerHeight);

  /* ---------- Navigation ---------- */

  // Ansicht über das URL-Fragment (#podcast-3), damit der Zurück-Button des Browsers funktioniert
  function route() {
    const match = /^#podcast-(\d+)$/.exec(location.hash);
    const index = match ? Number(match[1]) : -1;

    if (podcasts[index]) {
      renderDetail(index);
      overviewEl.hidden = true;
      detailEl.hidden = false;
      document.title = (podcasts[index].title || "Podcast") + " – SpotiMy";
      window.scrollTo(0, 0);
      $("back").focus({ preventScroll: true });
    } else {
      removeSpotify(); // stoppt auch die Spotify-Wiedergabe
      spotifyUsed = false;
      detailEl.hidden = true;
      overviewEl.hidden = false;
      document.title = "SpotiMy";
      if (lastTile) lastTile.focus();
    }
  }

  $("back").addEventListener("click", function () {
    if (spotifyUsed) {
      // Der Spotify-Player legt eigene Einträge im Browserverlauf an, history.back()
      // würde nur darin zurückspringen. Deshalb den Eintrag direkt durch die Übersicht ersetzen.
      history.replaceState(null, "", location.pathname + location.search);
      route();
    } else if (history.length > 1 && /^#podcast-/.test(location.hash)) {
      history.back();
    } else {
      location.hash = "";
    }
  });
  window.addEventListener("hashchange", route);

  function showError(message, hint) {
    const box = el("div", "notice", message);
    if (hint) box.append(el("p", null, hint));
    gridEl.replaceWith(box);
  }

  fetch("data/podcasts.json", { cache: "no-cache" })
    .then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    })
    .then(function (data) {
      podcasts = Array.isArray(data && data.podcasts) ? data.podcasts : [];
      if (!podcasts.length) {
        showError("Noch keine Podcasts da.",
          "Feed-Adressen in feeds.txt eintragen und „python update_feeds.py“ ausführen.");
        return;
      }
      renderOverview();
      buildSearchIndex();
      $("search-form").hidden = false;
      route();
    })
    .catch(function () {
      if (location.protocol === "file:") {
        showError("Bitte über einen Webserver öffnen.",
          "Im Projektordner „python -m http.server“ starten und http://localhost:8000 öffnen.");
      } else {
        showError("Die Podcasts konnten nicht geladen werden.",
          "Bitte zuerst „python update_feeds.py“ ausführen.");
      }
    });
})();
</script>
</body>
</html>
